services:
  - type: web
    name: thuocsi-vs-longchau
    runtime: node
    plan: free
    buildCommand: npm install && cd client && npm install --include=dev && npm run build
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: thuocsi-db
          property: connectionString
    healthCheckPath: /api/search?q=test

databases:
  - name: thuocsi-db
    plan: free
    databaseName: thuocsi_spy
